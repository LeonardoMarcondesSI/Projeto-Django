<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Excluir Aluno</title>
</head>
<body>

    <h1>Confirmar exclusão</h1>

    <p>
        Tem certeza que deseja excluir
        <strong>{{ aluno.nome }}</strong>?
    </p>

    <form method="post">
        {% csrf_token %}

        <button type="submit">
            Sim, excluir
        </button>
    </form>

    <a href="{% url 'aluno' %}">
        Cancelar
    </a>

</body>
</html>
